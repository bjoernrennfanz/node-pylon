# Mock build in GitHub Actions - no local compiler needed.
# Builds the N-API module without pylon SDK/camera (mock define = 1, default),
# then runs smoke tests and samples.
# Matrix (ZAU-152, analog pypylon platforms):
#   Linux x64 (ubuntu-22.04) + Linux arm64 (ubuntu-24.04-arm),
#   Windows x64 (windows-2022, VS2022 v17),
#   macOS (macos-14 arm64 + macos-15) x Node 20/22.
# Real-SDK build (needs pylon binaries via secret) runs as separate
# opt-in job and never blocks the mock matrix.
name: ci

on:
  push:
    branches:
      - "feature/node-port-native"
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-mock:
    name: mock (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 (VS2022 v17) instead of windows-latest: the latest image
        # ships VS v18, which the npm-bundled node-gyp cannot detect yet.
        # ubuntu-22.04 x64 + ubuntu-24.04-arm cover Linux x64/arm64 (pypylon parity).
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-2022, macos-14, macos-15]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install deps (skip install script, rebuild explicitly below)
        run: npm ci --ignore-scripts

      - name: Rebuild native mock addon (no pylon SDK needed)
        run: npm run rebuild:mock

      - name: Smoke tests (node --test, no camera)
        run: npm test

      - name: Samples (list-devices, grab-mock)
        run: |
          npm run sample:list
          npm run sample:grab

      - name: Upload mock prebuilt (.node)
        uses: actions/upload-artifact@v4
        with:
          name: node_pylon-mock-${{ matrix.os }}-node${{ matrix.node }}
          path: build/Release/node_pylon.node
          if-no-files-found: error
          retention-days: 7

  # Opt-in real build against Basler pylon SDK binaries.
  # Provide binaries via secret PYLON_SDK_URL (tarball/zip per OS) or a
  # pre-provisioned Artifactory mirror; without the secret the job skips
  # (never red) so forks without SDK access stay green.
  # Full wiring (PYLON_ROOT, link step) lands with ZAU-150; this job already
  # reserves the matrix slot and documents the secret contract.
  build-real:
    name: real-sdk (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for pylon SDK secret
        id: sdk
        shell: bash
        env:
          PYLON_SDK_URL: ${{ secrets.PYLON_SDK_URL }}
        run: |
          if [ -z "$PYLON_SDK_URL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No PYLON_SDK_URL secret — skipping real-SDK build (mock matrix above is the gate)."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js ${{ matrix.node }}
        if: steps.sdk.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup MSVC (Windows only)
        if: steps.sdk.outputs.available == 'true' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Note (SDK provided, build wiring follows in ZAU-150)
        if: steps.sdk.outputs.available == 'true'
        run: |
          echo "PYLON_SDK_URL is set. Real build wiring (download + PYLON_ROOT + rebuild:real) lands with ZAU-150."
