# Node-API build + test pipeline, modelled on pypylon (.github/workflows/main.yml).
#
# Shape (pypylon parity):
#   build  — one job, OS matrix, compiles the N-API addon once per OS
#   unit-tests — needs build, OS x Node matrix, downloads the matching
#     per-OS binary and runs the emulated suite + samples (no rebuild).
#   rn-build — one job, OS matrix, compile-checks the shared React-Native
#     core (react-native/shared/pylon_core.cpp) against the real SDK
#     (no link, no Node addon involved).
#   rn-tests — OS x Node matrix, runs the RN suites (`npm run test:rn`,
#     SDK-free; facade tests need Node >= 22.6 type stripping and skip
#     cleanly on Node 20).
#
# Matrix (per ZAU-172, extended per ZAU-174):
#   build:      ubuntu-22.04, ubuntu-24.04-arm, windows-2022, macos-latest
#               x Node 20 only.
#   unit-tests: same OS list x Node 20/22. macOS intentionally only
#               `macos-latest` (no macos-14 legacy leg).
#   rn-build:   same OS list x Node 20 only (Node only runs the configure
#               script; the check itself is pure C++).
#   rn-tests:   same OS list x Node 20/22 (no SDK, no addon binary needed).
#
# Node 20-only build: N-API (node-addon-api) is ABI-stable across Node
# majors, so the Node 20 binary runs unmodified on Node 22. The test job
# proves this by exercising every build artifact on both runtimes.
# Fallback if that ever breaks: extend the build matrix to `node: [20, 22]`
# and key artifact names on `node${{ matrix.node }}`.
#
# SDK comes exclusively from the PYLON_SDK_BASE_URL secret
# (Settings -> Secrets -> Actions). The base URL appears nowhere in the
# repo and is never printed to logs (GitHub additionally masks secrets;
# the leak-check step verifies the secret value is in no workspace file
# without printing matches).
name: ci

on:
  push:
    branches:
      - "feature/node-port-native"
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }}, node 20)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 (VS2022 v17) instead of windows-latest: the bundled
        # node-gyp does not detect VS v18 yet.
        # ubuntu-22.04 x64 + ubuntu-24.04-arm cover Linux x64/arm64
        # (pypylon parity). macOS: latest only (ZAU-172).
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-2022, macos-latest]
        node: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check pylon SDK secret (no URL in logs)
        shell: bash
        env:
          PYLON_SDK_BASE_URL: ${{ secrets.PYLON_SDK_BASE_URL }}
        run: |
          if [ -z "$PYLON_SDK_BASE_URL" ]; then
            echo "::error::PYLON_SDK_BASE_URL secret is not set. Add it under Settings -> Secrets -> Actions (base URL only, archive names are appended automatically)."
            exit 1
          fi
          echo "PYLON_SDK_BASE_URL is set (value masked, never printed)."

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download pylon SDK 26.09 (secret only, quiet)
        shell: bash
        env:
          PYLON_SDK_BASE_URL: ${{ secrets.PYLON_SDK_BASE_URL }}
        run: bash scripts/download-pylon-sdk.sh

      - name: Install deps (skip install script, rebuild explicitly below)
        run: npm ci --ignore-scripts

      - name: Configure native build flavor (real SDK, no secrets printed)
        shell: bash
        run: |
          node scripts/configure-build.js
          echo "--- build-config.gypi ---"
          cat build-config.gypi
          echo "--- SDK layout probe ---"
          ls "$PYLON_ROOT" || true
          ls "$PYLON_ROOT/Frameworks/pylon.framework/Versions/A/Headers/PylonIncludes.h" 2>/dev/null || true
          ls "$PYLON_ROOT/Frameworks/pylon.framework/Headers/PylonIncludes.h" 2>/dev/null || echo "(framework Headers symlink chain broken or absent)"
          ls "$PYLON_ROOT/include/pylon/PylonIncludes.h" 2>/dev/null || true

      - name: Rebuild native addon against real pylon SDK
        # Via the npm script (not bare node-gyp): npm puts its bundled
        # node-gyp on PATH; the configure step above already ran.
        run: npm run rebuild:real

      - name: Stage Windows runtime DLLs next to the addon
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "$env:PYLON_ROOT\Runtime\x64\*.dll" -Destination "build\Release\" -Force

      - name: Leak check (secret value must not appear in workspace files)
        shell: bash
        env:
          PYLON_SDK_BASE_URL: ${{ secrets.PYLON_SDK_BASE_URL }}
        run: |
          # -q: print no matches (the check itself must not leak the URL).
          # .git/node_modules/SDK staging areas are excluded.
          if grep -rqF "$PYLON_SDK_BASE_URL" --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.pylon-sdk --exclude="*.tar.gz" .; then
            echo "::error::Secret value found in workspace files. Remove it; only the variable name PYLON_SDK_BASE_URL may appear in code/workflows/docs."
            exit 1
          fi
          echo "Leak check passed: secret value absent from workspace files."
          # Strict second check: no http(s) URL in build/infra files
          # (except the allowlist of public doc links).
          VIOLATIONS="$(grep -rniE "https?://" scripts binding.gyp CMakeLists.txt package.json .github lib src samples types test 2>/dev/null | grep -viE "github\\.com|reactnative\\.dev|nodejs\\.org|npmjs\\.com|w3\\.org" || true)"
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Unexpected URL in infra/code files (only public doc links allowlisted):"
            echo "$VIOLATIONS" | cut -c1-200
            exit 1
          fi
          echo "URL check passed: no hardcoded URLs in infra/code files."

      - name: Upload built addon (.node)
        uses: actions/upload-artifact@v4
        with:
          name: node_pylon-build-${{ matrix.os }}-node20
          path: build/Release/node_pylon.node
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows runtime DLLs (build bundle)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: node_pylon-build-${{ matrix.os }}-node20-dlls
          path: build/Release/*.dll
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: tests (${{ matrix.os }}, node ${{ matrix.node }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Same OS list as build; macOS latest only (ZAU-172).
        # Node 20 + 22 both exercise the Node 20-built N-API binary
        # (ABI-stable, no rebuild in this job).
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-2022, macos-latest]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install deps (skip native rebuild; binary comes from build job)
        run: npm ci --ignore-scripts

      - name: Download built addon for ${{ matrix.os }} (Node 20 N-API binary)
        uses: actions/download-artifact@v4
        with:
          name: node_pylon-build-${{ matrix.os }}-node20
          path: build/Release/

      - name: Download Windows runtime DLLs
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: node_pylon-build-${{ matrix.os }}-node20-dlls
          path: build/Release/

      - name: Verify test binary present (no rebuild in this job)
        shell: bash
        run: |
          ls -la build/Release/node_pylon.node
          node -e "process.report.writeReport('node-version.json'); console.log(process.version, process.arch)"

      - name: Check pylon SDK secret (emulator libs need SDK layout)
        shell: bash
        env:
          PYLON_SDK_BASE_URL: ${{ secrets.PYLON_SDK_BASE_URL }}
        run: |
          if [ -z "$PYLON_SDK_BASE_URL" ]; then
            echo "::error::PYLON_SDK_BASE_URL secret is not set. Add it under Settings -> Secrets -> Actions."
            exit 1
          fi
          echo "PYLON_SDK_BASE_URL is set (value masked, never printed)."

      - name: Download pylon SDK 26.09 (runtime libs for camera emulator)
        shell: bash
        env:
          PYLON_SDK_BASE_URL: ${{ secrets.PYLON_SDK_BASE_URL }}
        run: bash scripts/download-pylon-sdk.sh

      - name: Unit tests (real addon, camera emulator, no hardware)
        # Emulated suite only (mirrors pypylon's all_emulated_tests.py):
        # GitHub CI provides the CamEmu emulator, never physical cameras,
        # so the gigE/usb hardware suites (`npm run test:hardware`) skip
        # there and run on hardware hosts only.
        shell: bash
        env:
          PYLON_CAMEMU: 2
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$PYLON_ROOT/Runtime/x64:$PATH"
            export GENICAM_GENTL64_PATH="$PYLON_ROOT/Runtime/x64"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LD_LIBRARY_PATH="$PYLON_ROOT/lib:${LD_LIBRARY_PATH:-}"
            export GENICAM_GENTL64_PATH="$PYLON_ROOT/lib/gentlproducer/gtl"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            export DYLD_LIBRARY_PATH="$PYLON_ROOT/Frameworks/pylon.framework/Versions/A/Libraries:${DYLD_LIBRARY_PATH:-}"
            export GENICAM_GENTL64_PATH="$PYLON_ROOT/Frameworks/pylon.framework/Versions/A/Libraries/gentlproducer/gtl"
          fi
          npm run test:emulated

      - name: Samples (list, grab, grab-options, nodemap, attributes)
        shell: bash
        env:
          PYLON_CAMEMU: 2
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$PYLON_ROOT/Runtime/x64:$PATH"
            export GENICAM_GENTL64_PATH="$PYLON_ROOT/Runtime/x64"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LD_LIBRARY_PATH="$PYLON_ROOT/lib:${LD_LIBRARY_PATH:-}"
            export GENICAM_GENTL64_PATH="$PYLON_ROOT/lib/gentlproducer/gtl"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            export DYLD_LIBRARY_PATH="$PYLON_ROOT/Frameworks/pylon.framework/Versions/A/Libraries:${DYLD_LIBRARY_PATH:-}"
            export GENICAM_GENTL64_PATH="$PYLON_ROOT/Frameworks/pylon.framework/Versions/A/Libraries/gentlproducer/gtl"
          fi
          npm run sample:list
          npm run sample:grab
          npm run sample:grab-options
          npm run sample:nodemap
          npm run sample:grabattrs

  rn-build:
    name: rn-core build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Same OS list as the addon build (pypylon parity).
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-2022, macos-latest]
        node: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check pylon SDK secret (no URL in logs)
        shell: bash
        env:
          PYLON_SDK_BASE_URL: ${{ secrets.PYLON_SDK_BASE_URL }}
        run: |
          if [ -z "$PYLON_SDK_BASE_URL" ]; then
            echo "::error::PYLON_SDK_BASE_URL secret is not set. Add it under Settings -> Secrets -> Actions (base URL only, archive names are appended automatically)."
            exit 1
          fi
          echo "PYLON_SDK_BASE_URL is set (value masked, never printed)."

      - name: Setup Node.js 20 (runs the configure script only)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download pylon SDK 26.09 (secret only, quiet)
        shell: bash
        env:
          PYLON_SDK_BASE_URL: ${{ secrets.PYLON_SDK_BASE_URL }}
        run: bash scripts/download-pylon-sdk.sh

      - name: Compile-check the shared RN core against the real SDK
        # No link, no Node addon: proves pylon_core.{h,cpp} compiles on
        # every OS (this is the build-log evidence for the RN API work).
        shell: bash
        run: |
          node scripts/configure-build.js
          node scripts/compile-pylon-core.js

  rn-tests:
    name: rn-tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Same OS list as the addon tests; Node 20 + 22. The suites are
        # pure JS and SDK-free (no camera, no addon binary, no `needs:`),
        # so they run in parallel with everything else. Facade tests need
        # Node >= 22.6 type stripping and skip cleanly on Node 20.
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-2022, macos-latest]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install deps (no native build needed for RN suites)
        run: npm ci --ignore-scripts

      - name: React Native suites (static, contract, functional, parity)
        shell: bash
        run: npm run test:rn
