# Real-SDK build in GitHub Actions (kein Mock mehr).
# Baut das N-API-Modul gegen Basler pylon SDK 26.09 und testet mit dem
# SDK-Kamera-Emulator (PYLON_CAMEMU) — keine physische Kamera noetig.
# Matrix (analog pypylon-Plattformen):
#   Linux x64 (ubuntu-22.04) + Linux arm64 (ubuntu-24.04-arm),
#   Windows x64 (windows-2022, VS2022 v17),
#   macOS (macos-14 arm64 + macos-15) x Node 20/22.
#
# SDK-Bezug ausschliesslich ueber das Secret PYLON_SDK_BASE_URL
# (Settings -> Secrets -> Actions). Die Basis-URL erscheint nirgends im
# Repo und wird nie in Logs ausgegeben (GitHub maskiert Secrets zusaetzlich;
# der Leak-Check-Step prueft, dass der Secret-Wert in keinem Workspace-File
# steht, ohne Treffer zu drucken).
name: ci

on:
  push:
    branches:
      - "feature/node-port-native"
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-real:
    name: real-sdk (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 (VS2022 v17) statt windows-latest: das mitgelieferte
        # node-gyp erkennt VS v18 noch nicht.
        # ubuntu-22.04 x64 + ubuntu-24.04-arm decken Linux x64/arm64 ab (pypylon-Paritaet).
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-2022, macos-14, macos-15]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check pylon SDK secret (no URL in logs)
        shell: bash
        env:
          PYLON_SDK_BASE_URL: ${{ secrets.PYLON_SDK_BASE_URL }}
        run: |
          if [ -z "$PYLON_SDK_BASE_URL" ]; then
            echo "::error::PYLON_SDK_BASE_URL secret is not set. Add it under Settings -> Secrets -> Actions (base URL only, archive names are appended automatically)."
            exit 1
          fi
          echo "PYLON_SDK_BASE_URL is set (value masked, never printed)."

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download pylon SDK 26.09 (secret only, quiet)
        shell: bash
        env:
          PYLON_SDK_BASE_URL: ${{ secrets.PYLON_SDK_BASE_URL }}
        run: bash scripts/download-pylon-sdk.sh

      - name: Install deps (skip install script, rebuild explicitly below)
        run: npm ci --ignore-scripts

      - name: Rebuild native addon against real pylon SDK
        run: npm run rebuild:real

      - name: Stage Windows runtime DLLs next to the addon
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "$env:PYLON_ROOT\Runtime\x64\*.dll" -Destination "build\Release\" -Force

      - name: Leak check (secret value must not appear in workspace files)
        shell: bash
        env:
          PYLON_SDK_BASE_URL: ${{ secrets.PYLON_SDK_BASE_URL }}
        run: |
          # -q: keine Treffer ausgeben (kein URL-Leak durch den Check selbst).
          # .git/node_modules/SDK-Ablage sind ausgenommen.
          if grep -rqF "$PYLON_SDK_BASE_URL" --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.pylon-sdk --exclude="*.tar.gz" .; then
            echo "::error::Secret value found in workspace files. Remove it; only the variable name PYLON_SDK_BASE_URL may appear in code/workflows/docs."
            exit 1
          fi
          echo "Leak check passed: secret value absent from workspace files."
          # Strenge Zweitpruefung: keine http(s)-URL in Build-/Infra-Dateien
          # (ausser Allowlist oeffentlicher Doku-Links).
          VIOLATIONS="$(grep -rniE "https?://" scripts binding.gyp CMakeLists.txt package.json .github lib src samples types test 2>/dev/null | grep -viE "github\\.com|reactnative\\.dev|nodejs\\.org|npmjs\\.com|w3\\.org" || true)"
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Unexpected URL in infra/code files (only public doc links allowlisted):"
            echo "$VIOLATIONS" | cut -c1-200
            exit 1
          fi
          echo "URL check passed: no hardcoded URLs in infra/code files."

      - name: Smoke tests (real addon, camera emulator, no hardware)
        shell: bash
        env:
          PYLON_CAMEMU: 2
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$PYLON_ROOT/Runtime/x64:$PATH"
            export GENICAM_GENTL64_PATH="$PYLON_ROOT/Runtime/x64"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LD_LIBRARY_PATH="$PYLON_ROOT/lib:${LD_LIBRARY_PATH:-}"
            export GENICAM_GENTL64_PATH="$PYLON_ROOT/lib/gentlproducer/gtl"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            export DYLD_LIBRARY_PATH="$PYLON_ROOT/Frameworks/pylon.framework/Libraries:${DYLD_LIBRARY_PATH:-}"
            export GENICAM_GENTL64_PATH="$PYLON_ROOT/Frameworks/pylon.framework/Libraries/gentlproducer/gtl"
          fi
          npm test

      - name: Samples (list, grab, grab-options, nodemap, attributes)
        shell: bash
        env:
          PYLON_CAMEMU: 2
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$PYLON_ROOT/Runtime/x64:$PATH"
            export GENICAM_GENTL64_PATH="$PYLON_ROOT/Runtime/x64"
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LD_LIBRARY_PATH="$PYLON_ROOT/lib:${LD_LIBRARY_PATH:-}"
            export GENICAM_GENTL64_PATH="$PYLON_ROOT/lib/gentlproducer/gtl"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            export DYLD_LIBRARY_PATH="$PYLON_ROOT/Frameworks/pylon.framework/Libraries:${DYLD_LIBRARY_PATH:-}"
            export GENICAM_GENTL64_PATH="$PYLON_ROOT/Frameworks/pylon.framework/Libraries/gentlproducer/gtl"
          fi
          npm run sample:list
          npm run sample:grab
          npm run sample:grab-mock
          npm run sample:grab-options
          npm run sample:nodemap
          npm run sample:grabattrs

      - name: Upload real prebuilt (.node)
        uses: actions/upload-artifact@v4
        with:
          name: node_pylon-real-${{ matrix.os }}-node${{ matrix.node }}
          path: build/Release/node_pylon.node
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows runtime DLLs (real prebuilt bundle)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: node_pylon-real-${{ matrix.os }}-node${{ matrix.node }}-dlls
          path: build/Release/*.dll
          if-no-files-found: error
          retention-days: 7
